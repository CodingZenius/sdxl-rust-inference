[package]
name = "sdxl-rust-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.9.1", features = ["cuda"] }
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
hf-hub = "0.4"
safetensors = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
image = "0.25"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
